services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vegmon
      POSTGRES_PASSWORD: vegmon
      POSTGRES_DB: vegmon
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vegmon"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://vegmon:vegmon@db:5432/vegmon
      JWT_SECRET_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data:ro

volumes:
  pgdata:
